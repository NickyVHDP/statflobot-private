appId: com.statflobot.app
productName: StatfloBot
copyright: "Copyright © 2026 StatfloBot"
asar: true

# Custom notarization hook. Built-in notarization is disabled below.
afterSign: ./scripts/notarize.js

directories:
  buildResources: assets
  output: dist

files:
  - electron/**
  - node_modules/**
  - package.json

extraResources:
  - from: ../ui/client/dist
    to: ui/client/dist

  - from: ../ui/server
    to: ui/server
    filter:
      - "**/*"
      - "!node_modules/**"
      # NEVER ship env files. `**/*` matches dotfiles, so ui/server/.env was
      # being copied to Contents/Resources/ui/server/.env — confirmed present
      # in the released StatfloBot-1.5.2-arm64-mac.zip. That build only carried
      # CLOUD_API_URL so nothing leaked, but any secret added to that file
      # would ship to every customer. Server-side secrets belong in Vercel env
      # only; ui/server/index.js falls back to a hardcoded public CLOUD_API_URL.
      - "!.env"
      - "!.env.*"

  - from: ../ui/server/node_modules
    to: ui/server/node_modules

  - from: ../src
    to: src

  - from: ../node_modules
    to: node_modules

  - from: ../package.json
    to: package.json

mac:
  category: public.app-category.productivity
  icon: assets/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: assets/entitlements.mac.plist
  entitlementsInherit: assets/entitlements.mac.plist

  # Important: do not use electron-builder's built-in notarization.
  # The afterSign hook above handles notarization.
  notarize: false

  target:
    - target: dmg
    - target: zip

win:
  icon: assets/icon.ico
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  perMachine: false
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  runAfterFinish: false
  unicode: true
  artifactName: StatfloBot-windows.exe

dmg:
  artifactName: "${productName}-mac-${arch}.dmg"
  title: Install StatfloBot
  contents:
    - x: 130
      y: 220
      type: file
    - x: 410
      y: 220
      type: link
      path: /Applications

publish:
  - provider: github
    owner: NickyVHDP
    repo: statflobot-private
    private: false
    # Upload into a DRAFT release. electron-updater cannot see drafts, so no
    # installed app can pick up a half-uploaded or unverified artifact set.
    # The release workflow flips the draft to public only after both the macOS
    # and Windows jobs have built and their update metadata has been verified
    # (hashes, sizes, and one zip per architecture).
    releaseType: draft