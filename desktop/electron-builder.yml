appId: com.statflobot.app
productName: StatfloBot
copyright: "Copyright © 2026 StatfloBot"
asar: true

# 🔥 Use custom notarization script ONLY
afterSign: ./scripts/notarize.js

directories:
  buildResources: assets
  output: dist

files:
  - electron/**
  - node_modules/**
  - package.json

extraResources:
  - from: ../ui/client/dist
    to: ui/client/dist

  - from: ../ui/server
    to: ui/server
    filter:
      - "**/*"
      - "!node_modules/**"

  - from: ../ui/server/node_modules
    to: ui/server/node_modules

  - from: ../src
    to: src

  - from: ../node_modules
    to: node_modules

  - from: ../package.json
    to: package.json

mac:
  category: public.app-category.productivity
  icon: assets/icon.icns

  # 🔐 REQUIRED FOR MAC SIGNING
  hardenedRuntime: true
  gatekeeperAssess: false

  entitlements: assets/entitlements.mac.plist
  entitlementsInherit: assets/entitlements.mac.plist

  # ❌ DO NOT include identity (GitHub Actions injects it)
  # ❌ DO NOT include notarize block (handled by afterSign)

  target:
    - target: dmg
    - target: zip

win:
  icon: assets/icon.ico
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  perMachine: false
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  runAfterFinish: false
  unicode: true
  artifactName: StatfloBot-windows.exe

dmg:
  title: Install StatfloBot
  contents:
    - x: 130
      y: 220
      type: file
    - x: 410
      y: 220
      type: link
      path: /Applications

# 📦 GitHub Releases (correct repo)
publish:
  - provider: github
    owner: NickyVHDP
    repo: statflobot-private
    private: false
    releaseType: release