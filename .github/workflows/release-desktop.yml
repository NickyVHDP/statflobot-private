name: Release Desktop App

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-mac:
    runs-on: macos-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 🔑 IMPORT CERTIFICATE (THIS FIXES SIGNING)
      - name: Import Code Signing Certificate
        uses: apple-actions/import-codesign-certs@v2
        with:
          p12-file-base64: ${{ secrets.CSC_LINK }}
          p12-password: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Write client env file
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          {
            echo "VITE_SUPABASE_URL=$VITE_SUPABASE_URL"
            echo "VITE_SUPABASE_ANON_KEY=$VITE_SUPABASE_ANON_KEY"
            echo "VITE_CLOUD_API_URL=https://statflobot.store"
          } > ui/client/.env

      - name: Write server env file
        run: echo "CLOUD_API_URL=https://statflobot.store" > ui/server/.env

      - name: Install UI client deps
        working-directory: ui/client
        run: npm install

      - name: Install server deps
        working-directory: ui/server
        run: npm ci --omit=dev

      - name: Install desktop deps
        working-directory: desktop
        run: npm install

      - name: Verify server node_modules
        run: |
          echo "=== ui/server/node_modules/express ==="
          ls ui/server/node_modules/express/package.json
          echo "=== ui/server/node_modules/socket.io ==="
          ls ui/server/node_modules/socket.io/package.json

      # 🚀 BUILD + SIGN + NOTARIZE + RELEASE
      - name: Publish Mac release
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run publish:mac