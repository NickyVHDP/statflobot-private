name: Release Desktop App

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ── Tests + release setup: gate everything before a byte is built ───────────
  # Also creates the draft release, exactly once. The platform jobs used to each
  # run "view, then create": running in parallel they could both see no release
  # and race to create it, and whichever lost would fail on the conflict.
  prepare:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # The tests use node:test with no test framework, but they require
      # src/statflo.js, which pulls in chalk and dotenv — so dependencies must
      # be installed. Playwright's browser download is skipped: nothing here
      # drives a browser.
      - name: Install root deps
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm ci --omit=dev

      - name: Run tests
        run: npm test

      - name: Ensure a DRAFT GitHub Release exists
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          # Created as a draft on purpose. The old workflow created a public
          # "latest" release before anything was built, then published artifacts
          # and only afterwards ran the metadata guards — so a build that failed
          # the guards had already exposed installed apps to bad metadata, with
          # nothing to retract it. Drafts are invisible to electron-updater; the
          # publish-release job flips this to public once every guard has passed.
          if gh release view "$TAG" --repo NickyVHDP/statflobot-private > /dev/null 2>&1; then
            IS_DRAFT=$(gh release view "$TAG" --repo NickyVHDP/statflobot-private --json isDraft --jq '.isDraft')
            if [ "$IS_DRAFT" != "true" ]; then
              echo "FATAL: release $TAG already exists and is PUBLIC."
              echo "electron-builder is configured with releaseType: draft and will refuse to upload to it,"
              echo "and republishing over a live release would expose installed apps to partial metadata."
              echo "Delete or re-draft the release, or tag a new version."
              exit 1
            fi
            echo "Draft release $TAG already exists ✓"
          else
            echo "Release $TAG not found — creating it as a draft"
            gh release create "$TAG" \
              --repo NickyVHDP/statflobot-private \
              --title "StatfloBot $TAG" \
              --notes "StatfloBot $TAG" \
              --draft
            echo "Draft release $TAG created ✓"
          fi

  # ── macOS: arm64 (Apple Silicon) + x64 (Intel) ─────────────────────────────
  release-mac:
    needs: prepare
    runs-on: macos-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Import Code Signing Certificate
        uses: apple-actions/import-codesign-certs@v2
        with:
          p12-file-base64: ${{ secrets.CSC_LINK }}
          p12-password: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Write client env file
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          {
            echo "VITE_SUPABASE_URL=$VITE_SUPABASE_URL"
            echo "VITE_SUPABASE_ANON_KEY=$VITE_SUPABASE_ANON_KEY"
            echo "VITE_CLOUD_API_URL=https://statflobot.store"
          } > ui/client/.env

      - name: Write server env file
        run: echo "CLOUD_API_URL=https://statflobot.store" > ui/server/.env

      - name: Install root bot deps
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm ci --omit=dev

      - name: Verify root node_modules
        run: |
          echo "=== minimist ==="
          ls node_modules/minimist/package.json
          echo "=== playwright ==="
          ls node_modules/playwright/package.json
          echo "=== dotenv ==="
          ls node_modules/dotenv/package.json

      - name: Install UI client deps
        working-directory: ui/client
        run: npm install

      - name: Build UI client
        working-directory: ui/client
        run: npm run build

      - name: Install server deps
        working-directory: ui/server
        run: npm ci --omit=dev

      - name: Verify server node_modules
        run: |
          echo "=== ui/server/node_modules/express ==="
          ls ui/server/node_modules/express/package.json
          echo "=== ui/server/node_modules/socket.io ==="
          ls ui/server/node_modules/socket.io/package.json

      - name: Install desktop deps
        working-directory: desktop
        run: npm install

      - name: Verify version matches tag
        run: |
          PACKAGE_VERSION=$(node -p "require('./desktop/package.json').version")
          TAG="${GITHUB_REF_NAME}"
          EXPECTED_TAG="v${PACKAGE_VERSION}"
          if [ "$TAG" != "$EXPECTED_TAG" ]; then
            echo "ERROR: git tag '$TAG' does not match desktop/package.json v${PACKAGE_VERSION} (expected tag '${EXPECTED_TAG}')"
            echo "Bump desktop/package.json version to match the tag before pushing."
            exit 1
          fi
          echo "Version check passed: $TAG == v${PACKAGE_VERSION} ✓"

      # Both architectures MUST be built in ONE electron-builder invocation.
      # As two separate commands the second overwrote latest-mac.yml, so the
      # published metadata described only the last architecture built (x64) and
      # Apple Silicon users auto-updated to the Intel build. A single
      # invocation emits one latest-mac.yml listing both zips, so each machine
      # downloads its native build.
      - name: Build and publish Mac arm64 + x64 (single invocation)
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx electron-builder --mac --arm64 --x64 --publish always

      - name: Verify packaged bot node_modules (both architectures)
        run: |
          for APPDIR in desktop/dist/mac-arm64 desktop/dist/mac; do
            APP="$APPDIR/StatfloBot.app/Contents/Resources"
            echo "=== $APPDIR ==="
            ls "$APP/node_modules/minimist/package.json"
            ls "$APP/node_modules/playwright/package.json"
            ls "$APP/node_modules/dotenv/package.json"
            if find "$APPDIR/StatfloBot.app" \( -name '.env' -o -name '.env.*' \) | grep -q .; then
              echo "FATAL: an env file was packaged into $APPDIR"
              exit 1
            fi
            echo "verified $APPDIR (modules present, no env files)"
          done

      # Guard: never ship update metadata that omits an architecture, or whose
      # hashes/sizes do not match the artifacts actually built. Counting
      # `sha512:` lines (what this step used to do) proves only that fields are
      # present — electron-updater verifies the checksum on the customer's
      # machine, so a stale hash fails there instead of here.
      - name: Verify latest-mac.yml (hashes, sizes, both architectures)
        run: node scripts/verify-update-metadata.js desktop/dist/latest-mac.yml --platform mac

      # Copy versioned DMGs to the stable names the download API expects
      - name: Upload stable-named Mac DMGs
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          arm64_dmg=$(ls desktop/dist/StatfloBot-mac-arm64.dmg 2>/dev/null | head -1)
          x64_dmg=$(ls desktop/dist/StatfloBot-mac-x64.dmg 2>/dev/null | head -1)

          if [ -z "$arm64_dmg" ]; then echo "ERROR: arm64 DMG not found"; ls desktop/dist/; exit 1; fi
          if [ -z "$x64_dmg"   ]; then echo "ERROR: x64 DMG not found";   ls desktop/dist/; exit 1; fi

          cp "$arm64_dmg" desktop/dist/StatfloBot-mac-apple-silicon.dmg
          cp "$x64_dmg"   desktop/dist/StatfloBot-mac-intel.dmg

          gh release upload "$TAG" \
            desktop/dist/StatfloBot-mac-apple-silicon.dmg \
            desktop/dist/StatfloBot-mac-intel.dmg \
            --clobber --repo NickyVHDP/statflobot-private

      - name: Verify Mac release assets
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          ASSETS=$(gh release view "$TAG" --repo NickyVHDP/statflobot-private --json assets --jq '[.assets[].name]|join("\n")')
          echo "Release assets:"
          echo "$ASSETS"
          echo "$ASSETS" | grep -q 'StatfloBot-mac-apple-silicon\.dmg' || { echo "MISSING: StatfloBot-mac-apple-silicon.dmg"; exit 1; }
          echo "$ASSETS" | grep -q 'StatfloBot-mac-intel\.dmg'         || { echo "MISSING: StatfloBot-mac-intel.dmg";         exit 1; }
          echo "All Mac assets verified ✓"

  # ── Windows: x64 ────────────────────────────────────────────────────────────
  release-win:
    needs: prepare
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Write client env file
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        shell: bash
        run: |
          {
            echo "VITE_SUPABASE_URL=$VITE_SUPABASE_URL"
            echo "VITE_SUPABASE_ANON_KEY=$VITE_SUPABASE_ANON_KEY"
            echo "VITE_CLOUD_API_URL=https://statflobot.store"
          } > ui/client/.env

      - name: Write server env file
        shell: bash
        run: echo "CLOUD_API_URL=https://statflobot.store" > ui/server/.env

      - name: Install root bot deps
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm ci --omit=dev

      - name: Verify root node_modules
        shell: bash
        run: |
          echo "=== minimist ==="
          ls node_modules/minimist/package.json
          echo "=== playwright ==="
          ls node_modules/playwright/package.json
          echo "=== dotenv ==="
          ls node_modules/dotenv/package.json

      - name: Install UI client deps
        working-directory: ui/client
        run: npm install

      - name: Build UI client
        working-directory: ui/client
        run: npm run build

      - name: Install server deps
        working-directory: ui/server
        run: npm ci --omit=dev

      - name: Install desktop deps
        working-directory: desktop
        run: npm install

      - name: Verify version matches tag
        shell: bash
        run: |
          PACKAGE_VERSION=$(node -p "require('./desktop/package.json').version")
          TAG="${GITHUB_REF_NAME}"
          EXPECTED_TAG="v${PACKAGE_VERSION}"
          if [ "$TAG" != "$EXPECTED_TAG" ]; then
            echo "ERROR: git tag '$TAG' does not match desktop/package.json v${PACKAGE_VERSION} (expected tag '${EXPECTED_TAG}')"
            echo "Bump desktop/package.json version to match the tag before pushing."
            exit 1
          fi
          echo "Version check passed: $TAG == v${PACKAGE_VERSION} ✓"

      - name: Build and publish Windows x64
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: npx electron-builder --win --x64 --publish always

      - name: Verify packaged bot resources (Windows)
        shell: bash
        run: |
          RESOURCES="desktop/dist/win-unpacked/resources"
          echo "=== src/main.js in packaged app ==="
          ls "$RESOURCES/src/main.js" || { echo "FATAL: src/main.js missing from packaged app"; exit 1; }
          echo "=== minimist in packaged node_modules ==="
          ls "$RESOURCES/node_modules/minimist/package.json" || { echo "FATAL: minimist missing — root npm ci must run before packaging"; exit 1; }
          echo "=== playwright in packaged node_modules ==="
          ls "$RESOURCES/node_modules/playwright/package.json" || { echo "FATAL: playwright missing from packaged node_modules"; exit 1; }
          echo "=== dotenv in packaged node_modules ==="
          ls "$RESOURCES/node_modules/dotenv/package.json" || { echo "FATAL: dotenv missing from packaged node_modules"; exit 1; }
          if find "desktop/dist/win-unpacked" \( -name '.env' -o -name '.env.*' \) | grep -q .; then
            echo "FATAL: an env file was packaged into the Windows build"
            exit 1
          fi
          echo "All Windows bot resources verified ✓ (no env files)"

      - name: Verify latest.yml (hashes and sizes)
        shell: bash
        run: node scripts/verify-update-metadata.js desktop/dist/latest.yml --platform win

      - name: Verify Windows release asset
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          ASSETS=$(gh release view "$TAG" --repo NickyVHDP/statflobot-private --json assets --jq '[.assets[].name]|join("\n")')
          echo "Release assets:"
          echo "$ASSETS"
          echo "$ASSETS" | grep -q 'StatfloBot-windows\.exe' || { echo "MISSING: StatfloBot-windows.exe"; exit 1; }
          echo "Windows asset verified ✓"

  # ── Publish: flip the verified draft to the public "latest" release ─────────
  # Runs only when BOTH platform jobs succeeded, so no installed app can ever
  # see a release whose metadata failed a guard or whose second architecture
  # never finished uploading. Until this job runs, the release is a draft and is
  # invisible to electron-updater.
  publish-release:
    needs: [release-mac, release-win]
    runs-on: ubuntu-latest

    steps:
      - name: Verify every expected asset is present before going public
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"

          # The release must still be the draft this run created. If something
          # already made it public, the exposure this whole design prevents has
          # happened and it should be investigated rather than rubber-stamped.
          IS_DRAFT=$(gh release view "$TAG" --repo NickyVHDP/statflobot-private --json isDraft --jq '.isDraft')
          if [ "$IS_DRAFT" != "true" ]; then
            echo "FATAL: release $TAG is no longer a draft — refusing to re-publish it."
            exit 1
          fi

          ASSETS=$(gh release view "$TAG" --repo NickyVHDP/statflobot-private --json assets --jq '[.assets[].name]|join("\n")')
          echo "Release assets:"
          echo "$ASSETS"

          MISSING=0
          # latest-mac.yml and latest.yml are the feeds electron-updater reads.
          for required in \
            'latest-mac.yml' \
            'latest.yml' \
            'StatfloBot-mac-apple-silicon.dmg' \
            'StatfloBot-mac-intel.dmg' \
            'StatfloBot-windows.exe'
          do
            if echo "$ASSETS" | grep -qx "$required"; then
              echo "  ok $required"
            else
              echo "  MISSING: $required"
              MISSING=1
            fi
          done

          echo "$ASSETS" | grep -qE '^StatfloBot-[0-9.]+-arm64-mac\.zip$' \
            || { echo "  MISSING: arm64 update zip"; MISSING=1; }
          echo "$ASSETS" | grep -qE '^StatfloBot-[0-9.]+-mac\.zip$' \
            || { echo "  MISSING: Intel update zip"; MISSING=1; }

          [ "$MISSING" -eq 0 ] || { echo "FATAL: refusing to publish an incomplete release"; exit 1; }

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release edit "$TAG" \
            --repo NickyVHDP/statflobot-private \
            --draft=false \
            --latest
          echo "Release $TAG is now public and marked latest ✓"
