name: Release Desktop App

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ── macOS: arm64 (Apple Silicon) + x64 (Intel) ─────────────────────────────
  release-mac:
    runs-on: macos-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Import Code Signing Certificate
        uses: apple-actions/import-codesign-certs@v2
        with:
          p12-file-base64: ${{ secrets.CSC_LINK }}
          p12-password: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Write client env file
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          {
            echo "VITE_SUPABASE_URL=$VITE_SUPABASE_URL"
            echo "VITE_SUPABASE_ANON_KEY=$VITE_SUPABASE_ANON_KEY"
            echo "VITE_CLOUD_API_URL=https://statflobot.store"
          } > ui/client/.env

      - name: Write server env file
        run: echo "CLOUD_API_URL=https://statflobot.store" > ui/server/.env

      - name: Install root bot deps
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm ci --omit=dev

      - name: Verify root node_modules
        run: |
          echo "=== minimist ==="
          ls node_modules/minimist/package.json
          echo "=== playwright ==="
          ls node_modules/playwright/package.json
          echo "=== dotenv ==="
          ls node_modules/dotenv/package.json

      - name: Install UI client deps
        working-directory: ui/client
        run: npm install

      - name: Build UI client
        working-directory: ui/client
        run: npm run build

      - name: Install server deps
        working-directory: ui/server
        run: npm ci --omit=dev

      - name: Verify server node_modules
        run: |
          echo "=== ui/server/node_modules/express ==="
          ls ui/server/node_modules/express/package.json
          echo "=== ui/server/node_modules/socket.io ==="
          ls ui/server/node_modules/socket.io/package.json

      - name: Install desktop deps
        working-directory: desktop
        run: npm install

      - name: Verify version matches tag
        run: |
          PACKAGE_VERSION=$(node -p "require('./desktop/package.json').version")
          TAG="${GITHUB_REF_NAME}"
          EXPECTED_TAG="v${PACKAGE_VERSION}"
          if [ "$TAG" != "$EXPECTED_TAG" ]; then
            echo "ERROR: git tag '$TAG' does not match desktop/package.json v${PACKAGE_VERSION} (expected tag '${EXPECTED_TAG}')"
            echo "Bump desktop/package.json version to match the tag before pushing."
            exit 1
          fi
          echo "Version check passed: $TAG == v${PACKAGE_VERSION} ✓"

      - name: Ensure GitHub Release exists
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" --repo NickyVHDP/statflobot-private > /dev/null 2>&1; then
            echo "Release $TAG already exists ✓"
          else
            echo "Release $TAG not found — creating it"
            gh release create "$TAG" \
              --repo NickyVHDP/statflobot-private \
              --title "StatfloBot $TAG" \
              --notes "StatfloBot $TAG" \
              --draft=false \
              --latest
            echo "Release $TAG created ✓"
          fi

      # Both architectures MUST be built in ONE electron-builder invocation.
      # As two separate commands the second overwrote latest-mac.yml, so the
      # published metadata described only the last architecture built (x64) and
      # Apple Silicon users auto-updated to the Intel build. A single
      # invocation emits one latest-mac.yml listing both zips, so each machine
      # downloads its native build.
      - name: Build and publish Mac arm64 + x64 (single invocation)
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx electron-builder --mac --arm64 --x64 --publish always

      - name: Verify packaged bot node_modules (both architectures)
        run: |
          for APPDIR in desktop/dist/mac-arm64 desktop/dist/mac; do
            APP="$APPDIR/StatfloBot.app/Contents/Resources"
            echo "=== $APPDIR ==="
            ls "$APP/node_modules/minimist/package.json"
            ls "$APP/node_modules/playwright/package.json"
            ls "$APP/node_modules/dotenv/package.json"
            if find "$APPDIR/StatfloBot.app" \( -name '.env' -o -name '.env.*' \) | grep -q .; then
              echo "FATAL: an env file was packaged into $APPDIR"
              exit 1
            fi
            echo "verified $APPDIR (modules present, no env files)"
          done

      # Guard: never ship update metadata that omits an architecture.
      - name: Verify latest-mac.yml covers BOTH architectures
        run: |
          YML=desktop/dist/latest-mac.yml
          test -f "$YML" || { echo "FATAL: $YML was not generated"; exit 1; }
          echo "--- latest-mac.yml ---"
          cat "$YML"

          grep -qE 'url: StatfloBot-[0-9.]+-arm64-mac\.zip' "$YML" \
            || { echo "FATAL: no arm64 zip in latest-mac.yml — Apple Silicon users would get the Intel build"; exit 1; }
          grep -qE 'url: StatfloBot-[0-9.]+-mac\.zip' "$YML" \
            || { echo "FATAL: no x64 zip in latest-mac.yml"; exit 1; }

          # Read URLs via a file + `while read` rather than iterating an
          # unquoted variable: word-splitting differs between shells, and this
          # form behaves identically everywhere.
          grep -E '^[[:space:]]+- url: ' "$YML" | sed 's/.*url: //' > /tmp/mac_urls.txt
          URL_COUNT=$(grep -c . /tmp/mac_urls.txt)
          SHA_COUNT=$(grep -c 'sha512:' "$YML")
          SIZE_COUNT=$(grep -c 'size:' "$YML")
          [ "$URL_COUNT" -ge 2 ]             || { echo "FATAL: expected at least 2 artifacts"; exit 1; }
          [ "$SHA_COUNT" -ge "$URL_COUNT" ]  || { echo "FATAL: missing sha512 entries"; exit 1; }
          [ "$SIZE_COUNT" -ge "$URL_COUNT" ] || { echo "FATAL: missing size entries"; exit 1; }

          MISSING=0
          while IFS= read -r u; do
            [ -z "$u" ] && continue
            if [ -f "desktop/dist/$u" ]; then
              echo "  ok $u ($(wc -c < "desktop/dist/$u") bytes)"
            else
              echo "  FATAL: $u is referenced but was not built"
              MISSING=1
            fi
          done < /tmp/mac_urls.txt
          [ "$MISSING" -eq 0 ] || exit 1
          echo "latest-mac.yml verified: $URL_COUNT artifacts, both architectures present"

      # Copy versioned DMGs to the stable names the download API expects
      - name: Upload stable-named Mac DMGs
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          arm64_dmg=$(ls desktop/dist/StatfloBot-mac-arm64.dmg 2>/dev/null | head -1)
          x64_dmg=$(ls desktop/dist/StatfloBot-mac-x64.dmg 2>/dev/null | head -1)

          if [ -z "$arm64_dmg" ]; then echo "ERROR: arm64 DMG not found"; ls desktop/dist/; exit 1; fi
          if [ -z "$x64_dmg"   ]; then echo "ERROR: x64 DMG not found";   ls desktop/dist/; exit 1; fi

          cp "$arm64_dmg" desktop/dist/StatfloBot-mac-apple-silicon.dmg
          cp "$x64_dmg"   desktop/dist/StatfloBot-mac-intel.dmg

          gh release upload "$TAG" \
            desktop/dist/StatfloBot-mac-apple-silicon.dmg \
            desktop/dist/StatfloBot-mac-intel.dmg \
            --clobber --repo NickyVHDP/statflobot-private

      - name: Verify Mac release assets
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          ASSETS=$(gh release view "$TAG" --repo NickyVHDP/statflobot-private --json assets --jq '[.assets[].name]|join("\n")')
          echo "Release assets:"
          echo "$ASSETS"
          echo "$ASSETS" | grep -q 'StatfloBot-mac-apple-silicon\.dmg' || { echo "MISSING: StatfloBot-mac-apple-silicon.dmg"; exit 1; }
          echo "$ASSETS" | grep -q 'StatfloBot-mac-intel\.dmg'         || { echo "MISSING: StatfloBot-mac-intel.dmg";         exit 1; }
          echo "All Mac assets verified ✓"

  # ── Windows: x64 ────────────────────────────────────────────────────────────
  release-win:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Write client env file
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        shell: bash
        run: |
          {
            echo "VITE_SUPABASE_URL=$VITE_SUPABASE_URL"
            echo "VITE_SUPABASE_ANON_KEY=$VITE_SUPABASE_ANON_KEY"
            echo "VITE_CLOUD_API_URL=https://statflobot.store"
          } > ui/client/.env

      - name: Write server env file
        shell: bash
        run: echo "CLOUD_API_URL=https://statflobot.store" > ui/server/.env

      - name: Install root bot deps
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm ci --omit=dev

      - name: Verify root node_modules
        shell: bash
        run: |
          echo "=== minimist ==="
          ls node_modules/minimist/package.json
          echo "=== playwright ==="
          ls node_modules/playwright/package.json
          echo "=== dotenv ==="
          ls node_modules/dotenv/package.json

      - name: Install UI client deps
        working-directory: ui/client
        run: npm install

      - name: Build UI client
        working-directory: ui/client
        run: npm run build

      - name: Install server deps
        working-directory: ui/server
        run: npm ci --omit=dev

      - name: Install desktop deps
        working-directory: desktop
        run: npm install

      - name: Verify version matches tag
        shell: bash
        run: |
          PACKAGE_VERSION=$(node -p "require('./desktop/package.json').version")
          TAG="${GITHUB_REF_NAME}"
          EXPECTED_TAG="v${PACKAGE_VERSION}"
          if [ "$TAG" != "$EXPECTED_TAG" ]; then
            echo "ERROR: git tag '$TAG' does not match desktop/package.json v${PACKAGE_VERSION} (expected tag '${EXPECTED_TAG}')"
            echo "Bump desktop/package.json version to match the tag before pushing."
            exit 1
          fi
          echo "Version check passed: $TAG == v${PACKAGE_VERSION} ✓"

      - name: Ensure GitHub Release exists
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" --repo NickyVHDP/statflobot-private > /dev/null 2>&1; then
            echo "Release $TAG already exists ✓"
          else
            echo "Release $TAG not found — creating it"
            gh release create "$TAG" \
              --repo NickyVHDP/statflobot-private \
              --title "StatfloBot $TAG" \
              --notes "StatfloBot $TAG" \
              --draft=false \
              --latest
            echo "Release $TAG created ✓"
          fi

      - name: Build and publish Windows x64
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: npx electron-builder --win --x64 --publish always

      - name: Verify packaged bot resources (Windows)
        shell: bash
        run: |
          RESOURCES="desktop/dist/win-unpacked/resources"
          echo "=== src/main.js in packaged app ==="
          ls "$RESOURCES/src/main.js" || { echo "FATAL: src/main.js missing from packaged app"; exit 1; }
          echo "=== minimist in packaged node_modules ==="
          ls "$RESOURCES/node_modules/minimist/package.json" || { echo "FATAL: minimist missing — root npm ci must run before packaging"; exit 1; }
          echo "=== playwright in packaged node_modules ==="
          ls "$RESOURCES/node_modules/playwright/package.json" || { echo "FATAL: playwright missing from packaged node_modules"; exit 1; }
          echo "=== dotenv in packaged node_modules ==="
          ls "$RESOURCES/node_modules/dotenv/package.json" || { echo "FATAL: dotenv missing from packaged node_modules"; exit 1; }
          echo "All Windows bot resources verified ✓"

      - name: Verify Windows release asset
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          ASSETS=$(gh release view "$TAG" --repo NickyVHDP/statflobot-private --json assets --jq '[.assets[].name]|join("\n")')
          echo "Release assets:"
          echo "$ASSETS"
          echo "$ASSETS" | grep -q 'StatfloBot-windows\.exe' || { echo "MISSING: StatfloBot-windows.exe"; exit 1; }
          echo "Windows asset verified ✓"
